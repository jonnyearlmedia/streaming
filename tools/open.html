<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Opening Stremio</title>
<style>
  :root{
    --ground:#100C0C; --card:#1A1413; --ink:#F4EDEA; --muted:#A4918C;
    --line:#332726; --scarlet:#EF5A4F; --gold:#C8AE72;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;background:var(--ground);color:var(--ink);
    font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
    display:flex;align-items:center;justify-content:center;padding:24px;
  }
  .card{
    width:100%;max-width:380px;background:var(--card);border:1px solid var(--line);
    border-top:3px solid var(--scarlet);border-radius:4px;padding:26px 22px;text-align:center;
  }
  h1{
    margin:0 0 6px;font-size:19px;letter-spacing:.02em;text-transform:uppercase;font-weight:600;
  }
  p{margin:0;color:var(--muted);font-size:13.5px;}
  .q{color:var(--gold);font-weight:600;}
  .acts{display:flex;flex-direction:column;gap:9px;margin-top:22px;}
  a.btn{
    display:block;padding:11px 14px;border-radius:3px;text-decoration:none;font-size:14px;font-weight:600;
    background:var(--scarlet);color:#fff;
  }
  a.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);font-weight:500;}
  .fallback{margin-top:18px;}
  .fallback[hidden]{display:none;}
  .dots{color:var(--muted);font-size:13px;margin-top:16px;}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;}}
</style>
</head>
<body>
<div class="card">
  <h1>Opening Stremio</h1>
  <p>Searching <span class="q" id="what">49ers</span></p>
  <div class="dots" id="status">Handing off to the app…</div>
  <div class="acts fallback" id="fallback" hidden>
    <a class="btn" id="appLink" href="#">Open the Stremio app</a>
    <a class="btn ghost" id="webLink" href="#" rel="noopener">Open Stremio Web instead</a>
  </div>
</div>
<script>
(function(){
  var p = new URLSearchParams(location.search);
  var q = p.get("q") || "49ers";
  var id = p.get("id");
  var forceApp = p.get("app") === "1";
  var forceWeb = p.get("web") === "1";

  var path = id
    ? "/detail/sport/" + encodeURIComponent(id)
    : "/search?search=" + encodeURIComponent(q);

  var app = "stremio://" + path;
  var web = "https://web.stremio.com/#" + path;

  document.getElementById("what").textContent = id ? id.replace(/^streamed:/, "").replace(/-\d+$/, "").replace(/-/g, " ") : q;
  document.getElementById("appLink").href = app;
  document.getElementById("webLink").href = web;

  var ua = navigator.userAgent || "";
  var iOS = /iPad|iPhone|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);

  function showFallback(msg){
    document.getElementById("status").textContent = msg;
    document.getElementById("fallback").hidden = false;
  }

  if (forceWeb || (iOS && !forceApp)) {
    // No full Stremio app ships for iOS, so go straight to the web player.
    location.replace(web);
    return;
  }

  // Desktop and Android: hand off to the installed app, keep a visible way out.
  try { location.href = app; } catch (e) {}
  setTimeout(function(){
    showFallback("Didn't open? Pick one:");
  }, 1500);

  document.addEventListener("visibilitychange", function(){
    if (document.hidden) document.getElementById("status").textContent = "Opened in the app.";
  });
})();
</script>
</body>
</html>
